<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Загрузка изображения</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }
    h2 { margin-bottom: 24px; color: #1a1a2e; }

    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 16px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #6366f1;
      background: #f5f3ff;
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-zone p { color: #666; font-size: 14px; pointer-events: none; }
    .drop-zone .icon { font-size: 36px; margin-bottom: 8px; }

    .preview-wrap { margin-top: 16px; display: none; }
    .preview-wrap img {
      width: 100%; border-radius: 8px; max-height: 240px;
      object-fit: cover; border: 1px solid #e5e7eb;
    }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: #aaa; font-size: 13px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #e5e7eb;
    }

    .camera-section { text-align: center; }
    video { width: 100%; border-radius: 8px; display: none; background: #000; }
    canvas { display: none; }

    button {
      width: 100%; padding: 12px;
      border: none; border-radius: 8px;
      font-size: 15px; cursor: pointer;
      font-weight: 600; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-camera {
      background: #f3f4f6; color: #374151;
      margin-bottom: 10px;
    }
    .btn-capture { background: #ef4444; color: white; display: none; margin-bottom: 10px; }
    .btn-submit { background: #6366f1; color: white; margin-top: 20px; }

    .status {
      margin-top: 16px; padding: 12px; border-radius: 8px;
      font-size: 14px; display: none; text-align: center;
    }
    .status.success { background: #d1fae5; color: #065f46; display: block; }
    .status.error   { background: #fee2e2; color: #991b1b; display: block; }
    .status.loading { background: #e0e7ff; color: #3730a3; display: block; }
  </style>
</head>
<body>
<div class="card">
  <h2>📷 Завантажуйте зображення</h2>

  <!-- Drag & drop / file pick -->
  <div class="drop-zone" id="dropZone">
    <div class="icon">🖼️</div>
    <p>Перетащите файл сюда<br>или нажмите для выбора</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>
  <div class="preview-wrap" id="previewWrap">
    <img id="preview" src="" alt="Предпросмотр">
  </div>

  <div class="divider">или</div>

  <!-- Camera -->
  <div class="camera-section">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <button class="btn-camera" id="btnCamera">📸 Открыть камеру</button>
    <button class="btn-capture" id="btnCapture">🔴 Сделать снимок</button>
  </div>

  <button class="btn-submit" id="btnSubmit">Отправить</button>
  <div class="status" id="status"></div>
</div>

<script>
  // ⚠️ Замените на ваш реальный URL вебхука из n8n
  const WEBHOOK_URL = 'https://your-n8n-instance.com/webhook/abc123';

  let selectedFile = null;
  let stream = null;

  const fileInput  = document.getElementById('fileInput');
  const dropZone   = document.getElementById('dropZone');
  const previewWrap= document.getElementById('previewWrap');
  const preview    = document.getElementById('preview');
  const video      = document.getElementById('video');
  const canvas     = document.getElementById('canvas');
  const btnCamera  = document.getElementById('btnCamera');
  const btnCapture = document.getElementById('btnCapture');
  const btnSubmit  = document.getElementById('btnSubmit');
  const status     = document.getElementById('status');

  // --- File input ---
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) setFile(e.target.files[0]);
  });

  // --- Drag & drop ---
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) setFile(f);
  });

  function setFile(file) {
    selectedFile = file;
    const url = URL.createObjectURL(file);
    preview.src = url;
    previewWrap.style.display = 'block';
    stopCamera();
  }

  // --- Camera ---
  btnCamera.addEventListener('click', async () => {
    if (stream) { stopCamera(); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      video.style.display = 'block';
      btnCamera.textContent = '❌ Закрыть камеру';
      btnCapture.style.display = 'block';
    } catch {
      showStatus('Не удалось получить доступ к камере', 'error');
    }
  });

  btnCapture.addEventListener('click', () => {
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    canvas.toBlob(blob => {
      setFile(new File([blob], `photo_${Date.now()}.jpg`, { type: 'image/jpeg' }));
    }, 'image/jpeg', 0.92);
  });

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.style.display = 'none';
    btnCapture.style.display = 'none';
    btnCamera.textContent = '📸 Открыть камеру';
  }

  // --- Submit ---
  btnSubmit.addEventListener('click', async () => {
    if (!selectedFile) {
      showStatus('Выберите или сфотографируйте изображение', 'error'); return;
    }
    showStatus('Отправка...', 'loading');
    const form = new FormData();
    form.append('image', selectedFile, selectedFile.name);

    try {
      const res = await fetch(WEBHOOK_URL, { method: 'POST', body: form });
      if (res.ok) {
        showStatus('✅ Изображение успешно отправлено!', 'success');
        selectedFile = null;
        preview.src = '';
        previewWrap.style.display = 'none';
        fileInput.value = '';
      } else {
        showStatus(`Ошибка сервера: ${res.status}`, 'error');
      }
    } catch {
      showStatus('Ошибка соединения с сервером', 'error');
    }
  });

  function showStatus(msg, type) {
    status.textContent = msg;
    status.className = `status ${type}`;
  }
</script>
</body>
</html>
